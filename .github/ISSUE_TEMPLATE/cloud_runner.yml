name: Cloud Runner redirect
description: Do NOT paste private agent URLs or emails here — use the private site form
title: "[cloud] redirect to private form"
labels: ["cloud-runner"]
body:
  - type: markdown
    attributes:
      value: |
        **Stop — do not put work emails or agent URLs in this public issue.**

        Use the private form on the site instead:
        https://antonrabcuk8-lgtm.github.io/flawd/#cloud

        That path uses Formspree/email and never publishes your staging endpoint.

        If you only need to say “I’m interested”, leave a one-line note below with **no secrets**.
  - type: textarea
    id: note
    attributes:
      label: Public note (optional, no secrets)
      description: e.g. “Interested in B2B audit — will use the private form.”
      placeholder: Interested — contacting via site form.
