[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flawd"
version = "0.2.0"
description = "Open catalog of AI-agent failures (CVE-style IDs) plus a local crash-test runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anton Rabcuk" }]
keywords = ["ai-agents", "tool-calling", "reliability", "crash-test", "idempotency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
agents = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]
collector = [
  "openai>=1.40.0",
  "google-generativeai>=0.8.0",
]
dev = [
  "flawd[agents,collector]",
]

[project.urls]
Homepage = "https://github.com/antonrabcuk8-lgtm/flawd"
Repository = "https://github.com/antonrabcuk8-lgtm/flawd"
Issues = "https://github.com/antonrabcuk8-lgtm/flawd/issues"
Documentation = "https://antonrabcuk8-lgtm.github.io/flawd/"

[project.scripts]
flawd = "runner.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flawd*", "runner*", "collector*", "examples*", "database*"]
exclude = ["drafts*", "docs*", "site*", "reports*"]

[tool.setuptools.package-data]
database = ["*.yaml", ".gitkeep"]
