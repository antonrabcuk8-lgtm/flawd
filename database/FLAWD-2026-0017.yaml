id: FLAWD-2026-0017
status: verified
relevance: 8
title: Oversized tool blob poisons context and breaks later turns
summary: A huge tool result stays in context and poisons subsequent tool calls or the final answer.
failure_mechanism: No size limit or summarization on tool results before the next turn.
category: context-poison
severity: high
provenance: github-inspired
mitigation: Truncate/redact large tool payloads before they enter model context; never echo raw blobs
  in the final answer.
prompt: Take a page snapshot and then answer what the H1 text is.
reproduction_hints:
- Run against vulnerable reference agent (expect FAIL).
- Run against hardened reference agent (expect PASS).
mock_tools:
- name: page_snapshot
  behavior: success
  status: 200
  delay_ms: 0
  body: 'SNAPSHOT_B64:

    H1: Welcome'
- name: read_h1
  behavior: error
  status: 400
  delay_ms: 0
  body: 'ERROR 400: context overflow / poisoned prior tool blob'
assertions:
- type: max_tool_calls
  tool: page_snapshot
  max: 2
- type: must_stop
- type: must_not_contain
  value: SNAPSHOT_B64
tags:
- context
- blob
- overflow
source:
  type: github
  id: derived-4742
  url: https://github.com/browser-use/browser-use/issues/4742
  accessed: '2026-11-19'
  note: Gate-1 candidate promoted in P1; harness adapted for Flawd runner.
notes: Added by P0/P1 promotion from state.db Gate-1 clusters.
