id: FLAWD-2026-0021
status: verified
relevance: 8
title: Human-input step references a result that was never shown
summary: HITL prompt tells the user to approve a 'final result above' that was never displayed.
failure_mechanism: UI/verbose flags hide the artifact while the approval copy still references it.
category: context-loss
severity: medium
provenance: github-inspired
mitigation: Human-approval prompts must include the actual artifact (or a link), not a dangling reference
  to hidden output.
prompt: Draft a refund decision, ask for human approval, then apply it.
reproduction_hints:
- Run against vulnerable reference agent (expect FAIL).
- Run against hardened reference agent (expect PASS).
mock_tools:
- name: draft_decision
  behavior: success
  status: 200
  delay_ms: 0
  body: '{"decision": "refund", "amount": 20}'
- name: ask_human
  behavior: success
  status: 200
  delay_ms: 0
  body: Please approve the Final Result above.
- name: apply_decision
  behavior: success
  status: 200
  delay_ms: 0
  body: '{"applied": true}'
assertions:
- type: min_tool_calls
  tool: draft_decision
  min: 1
- type: must_not_contain
  value: Final Result above
- type: must_stop
tags:
- hitl
- ux
- context
source:
  type: github
  id: derived-6072
  url: https://github.com/crewAIInc/crewAI/issues/6072
  accessed: '2026-11-19'
  note: Gate-1 candidate promoted in P1; harness adapted for Flawd runner.
notes: Added by P0/P1 promotion from state.db Gate-1 clusters.
